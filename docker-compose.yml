services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: biomesh
      POSTGRES_USER: biomesh
      POSTGRES_PASSWORD: biomesh_dev
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biomesh -d biomesh"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://biomesh:biomesh_dev@postgres:5432/biomesh
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  data-science:
    build: ./data-science
    environment:
      BIOMESH_ROUNDS: 3
      BIOMESH_CLIENTS: 5
      DATABASE_URL: postgresql://biomesh:biomesh_dev@postgres:5432/biomesh
      BIOMESH_SITE_HASH_KEY: local-development-only
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [simulation]

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "55173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
